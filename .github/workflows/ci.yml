# Continuous integration for dieselsim.
#
# Independent jobs, so a failure says where the problem is:
#   physics          native CPython, the reference implementation
#   physics-pyodide  the SAME suite under Pyodide - ADR-001's guarantee
#   fixtures         golden fixtures are current, and every TypeScript port
#                    matches them (ADR-004)
#   web-grid-e2e     a full operating grid built in Chrome through the app's
#                    worker matches a native build cell for cell (Phase 2 exit)
#   solver           the TypeScript SolverPort, end to end through a real worker
#   web-app          the Angular app: unit tests and the GitHub Pages build
#   web-e2e          the Pages build in real headless Chrome: Python boots in the
#                    page's worker and a dyno pull matches native Python
#   web-custom-e2e   a custom engine end to end in Chrome (ADR-014): its
#                    drivable grid built by the page's worker pool, stopped,
#                    resumed, saved, and driven on /enjoy
name: CI

on:
  pull_request:           # every PR, including stacked PRs onto non-main branches
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  physics:
    name: physics (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # 30, not 20: with Phase 6's tests the suite took 11-20 min on the same
    # tree depending on runner load, and 3 of 22 runs were killed at 20m15s
    # (REVIEW-008 M-4)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest supported version, and this project has a history
        # of syntax that works on 3.12 but not 3.10 (f-string escapes).
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      # every file, not only those the suite imports - play.py and demo.py
      # are never imported by the tests
      - name: byte-compile everything
        run: python -m compileall -q dieselsim tests tools play.py demo.py
      - run: python tests/test_physics.py

  physics-pyodide:
    name: physics under Pyodide
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/pyodide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pyodide/package-lock.json
      - run: npm ci
      - run: npm run suite

  # ADR-004. First: the committed fixtures still match what the Python
  # original computes from their stored inputs (a physics change without
  # regenerated fixtures fails here, naming the module). Then: every
  # TypeScript port in web/physics matches the fixtures.
  fixtures:
    name: golden fixtures + TypeScript ports (ADR-004)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: fixtures are current
        run: python tools/fixtures/gen_fixtures.py --check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/physics/package-lock.json
      - run: npm ci
        working-directory: web/physics
      - name: ports match the fixtures
        run: npm test
        working-directory: web/physics

  solver:
    name: SolverPort (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/solver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/solver/package-lock.json
      - run: npm ci
      - run: npm test

  # The Angular app. Unit tests, then the GitHub Pages build - never plain
  # `build`, which renders a blank page on Pages. The app compiles the solver
  # from ../solver/src, so web/solver's dependencies are installed too (for
  # the pyodide types). The browser e2e check is not run here yet.
  web-app:
    name: web app (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Angular 22 needs >= 22.22.3; "22" resolves to the latest 22.x
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/solver/package-lock.json
      - run: npm ci
        working-directory: web/solver
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build:pages
      - name: prepare-assets on a network without the Pyodide CDN
        run: npm run check:assets

  # The built app in a real browser. A dyno pull is solved by Python in the
  # page's worker and checked against native Python at three points
  # (e2e/native_ref.py), plus MIME types, the worker, the cache and the
  # console. Chrome is preinstalled on GitHub's Ubuntu runners.
  web-e2e:
    name: web app in Chrome (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/solver/package-lock.json
      - run: npm ci
        working-directory: web/solver
      - run: npm ci
      - run: npm run build:pages
      - name: e2e in headless Chrome
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # Phase 3: the real-time drive -- prebuilt grid loaded and current, the
      # worker at 60 Hz, and a 60 s scripted drive matching native Python
      - name: drive e2e in headless Chrome
        run: npm run e2e:drive
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: engine-sound e2e in headless Chrome
        run: npm run e2e:sound
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: enjoy mode (touch) e2e in headless Chrome
        run: npm run e2e:enjoy
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: cycle page e2e in headless Chrome (Phase 6, against native Python)
        run: npm run e2e:cycle
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: spec editor e2e in headless Chrome (Phase 6, an edit solved against native Python)
        run: npm run e2e:spec
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: sweep page e2e in headless Chrome (Phase 6, against native Python)
        run: npm run e2e:sweep
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: web/app/e2e/out/
          if-no-files-found: ignore

  # PLAN.md Phase 2's exit criterion, checked on every PR: a full 8 x 6 grid
  # (crdi15) built in headless Chrome through the app's own worker and
  # SolverPort matches a native-Python build of the same grid, every perf
  # value of every cell at 1e-5; then a second build comes from the cache.
  web-grid-e2e:
    name: grid in Chrome matches native (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/solver/package-lock.json
      - run: npm ci
        working-directory: web/solver
      - run: npm ci
      - run: npm run build:pages
      - name: grid e2e in headless Chrome
        run: npm run e2e:grid
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grid-e2e-screenshots
          path: web/app/e2e/out/
          if-no-files-found: ignore

  # ADR-014, owner's choice (2026-10-03): the custom-engine flow on every PR,
  # as its own job so it does not lengthen the others. A 2 x 2 grid through
  # the e2e-only ?gridsize hook; on CI's 2 cores the pool is one worker,
  # ~15 min. No native reference needed.
  web-custom-e2e:
    name: custom engine in Chrome (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/solver/package-lock.json
      - run: npm ci
        working-directory: web/solver
      - run: npm ci
      - run: npm run build:pages
      - name: custom-engine e2e in headless Chrome
        run: npm run e2e:custom
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: custom-e2e-screenshots
          path: web/app/e2e/out/
          if-no-files-found: ignore
