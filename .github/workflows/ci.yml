# Continuous integration for dieselsim.
#
# Four independent jobs, so a failure says where the problem is:
#   physics          native CPython, the reference implementation
#   physics-pyodide  the SAME suite under Pyodide - ADR-001's guarantee
#   solver           the TypeScript SolverPort, end to end through a real worker
#   web-app          the Angular app: unit tests and the GitHub Pages build
name: CI

on:
  pull_request:           # every PR, including stacked PRs onto non-main branches
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  physics:
    name: physics (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest supported version, and this project has a history
        # of syntax that works on 3.12 but not 3.10 (f-string escapes).
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      # every file, not only those the suite imports - play.py and demo.py
      # are never imported by the tests
      - name: byte-compile everything
        run: python -m compileall -q dieselsim tests tools play.py demo.py
      - run: python tests/test_physics.py

  physics-pyodide:
    name: physics under Pyodide
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/pyodide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pyodide/package-lock.json
      - run: npm ci
      - run: npm run suite

  solver:
    name: SolverPort (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/solver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/solver/package-lock.json
      - run: npm ci
      - run: npm test

  # The Angular app. Unit tests, then the GitHub Pages build - never plain
  # `build`, which renders a blank page on Pages. The app compiles the solver
  # from ../solver/src, so web/solver's dependencies are installed too (for
  # the pyodide types). The browser e2e check is not run here yet.
  web-app:
    name: web app (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Angular 22 needs >= 22.22.3; "22" resolves to the latest 22.x
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            web/solver/package-lock.json
      - run: npm ci
        working-directory: web/solver
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build:pages
